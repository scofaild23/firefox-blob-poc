# Build Firefox and run the RecvBlobURLDataRequest PoC.
#
# Run #1 died in the Build step after 28m50s with exit 143 (SIGTERM) — not the
# 350-minute job timeout, which was nowhere near. On a 4 vCPU / 16 GiB hosted
# runner, a SIGTERM ~29 minutes into a Firefox build lands squarely in the Rust
# phase (style, webrender), where several rustc processes each hold multiple GiB.
# Memory pressure that stalls the runner agent is reported exactly this way.
# Disk is the other candidate: the default image leaves only ~21 GiB free on /,
# and a Firefox objdir can outgrow that.
#
# So this revision does four separate things:
#   1. removes the cause     - swap, capped parallelism, a much smaller build
#   2. removes the disk risk - everything moves to /mnt (~65 GiB free)
#   3. makes failure cheap   - sccache is saved even when the build dies, so each
#                              run resumes instead of restarting from zero
#   4. makes failure legible - a background monitor logs memory and disk every
#                              30 s, so a second failure is diagnosed, not guessed
#
# Nothing here touches the security-relevant code paths: webrtc, av1, a11y and
# the wasm sandbox are unrelated to blob URLs and IPC principal handling.

name: Firefox blob PoC

on:
  workflow_dispatch:

env:
  SRC: /mnt/ffx
  OBJ: /mnt/objdir
  SCCACHE_DIR: /mnt/sccache
  SCCACHE_CACHE_SIZE: 9G
  CARGO_BUILD_JOBS: 3

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out this repo (patch + test live here)
        uses: actions/checkout@v5
        with:
          path: poc

      - name: Prepare the runner — disk, swap, workspace
        run: |
          echo "=== before ==="; free -h; df -h / /mnt
          # the hosted image ships ~30 GiB of toolchains this build never touches
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          # swap is what keeps rustc and the linker alive instead of being killed
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=10
          # /mnt is the big disk; / is not big enough for source + objdir
          sudo mkdir -p "$SRC" "$OBJ" "$SCCACHE_DIR"
          sudo chown -R "$(id -un)" /mnt
          echo "=== after ==="; free -h; df -h / /mnt; swapon --show

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/sccache
          key: sccache-ffx-v2-${{ github.run_id }}
          restore-keys: sccache-ffx-v2-

      - name: Clone mozilla-firefox (shallow)
        run: |
          git clone --depth 1 https://github.com/mozilla-firefox/firefox.git "$SRC"
          git -C "$SRC" log -1 --format='%H %ad' --date=short

      - name: Bootstrap build dependencies
        run: cd "$SRC" && ./mach --no-interactive bootstrap --application-choice browser

      - name: Apply the PoC patch
        run: |
          cd "$SRC"
          git apply --verbose "$GITHUB_WORKSPACE/poc/poc-compromised-content.patch"
          git diff --stat

      - name: Write mozconfig
        run: |
          cat > "$SRC/mozconfig" <<EOF
          ac_add_options --disable-debug
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --disable-tests
          # the single biggest cut in peak memory and disk during compile and link
          ac_add_options --disable-debug-symbols
          ac_add_options --enable-linker=lld
          # none of these touch blob URLs or IPC principals; all are slow to build.
          # kept deliberately conservative — an unsupported option combination would
          # cost another failed run, which is worse than the minutes it would save.
          ac_add_options --disable-webrtc
          ac_add_options --disable-crashreporter
          ac_add_options --disable-updater
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --with-ccache=sccache
          # 4 vCPU, but peak RSS scales with job count. 3 rather than 2: with swap
          # in place nothing gets killed, and dropping to 2 risks not finishing
          # inside the step cap — which costs a whole extra run.
          mk_add_options MOZ_PARALLEL_BUILD=3
          mk_add_options MOZ_OBJDIR=$OBJ
          EOF
          cat "$SRC/mozconfig"

      - name: Build
        id: build
        continue-on-error: true      # a dead build must still save its cache
        timeout-minutes: 290         # well under the job cap, so later steps run
        run: |
          # if this run dies again, the monitor output says whether it was memory
          # or disk — no guessing a third time
          ( while true; do
              echo "[mon $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/{printf "mem_used=%sM avail=%sM",$3,$7}') \
          $(free -m | awk '/Swap:/{printf " swap_used=%sM",$3}') \
          $(df -m /mnt | awk 'NR==2{printf " mnt_free=%sM",$4}')"
              sleep 30
            done ) &
          MON=$!
          cd "$SRC"
          # Run #2 exited 0 in 21 minutes and left nothing at $OBJ — far too fast
          # for a cold build. Print what mach actually resolved before trusting it.
          echo "===== mach environment ====="
          ./mach environment || true
          echo "===== mozconfig in effect ====="
          ./mach environment 2>/dev/null | grep -i "mozconfig\|topobjdir" || true
          set +e
          ./mach build 2>&1 | tee /mnt/build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "===== last 60 lines of build output ====="
          tail -60 /mnt/build.log
          kill $MON 2>/dev/null || true
          echo "mach build exit code = $rc"
          echo "=== final state ==="; free -h; df -h /mnt
          sccache --show-stats || true
          exit $rc

      - name: Save sccache        # runs even when the build died, so reruns resume
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/sccache
          key: sccache-ffx-v2-${{ github.run_id }}

      - name: Did we get a binary?
        id: check
        run: |
          # Do not assume the objdir: run #2 built with exit 0 and left $OBJ empty,
          # which means mach resolved a different topobjdir than the mozconfig asked
          # for. Search for the binary instead of trusting a hardcoded path.
          BIN=$(find /mnt "$SRC" -maxdepth 6 -type f -name firefox -perm -u+x 2>/dev/null | head -1)
          echo "search result: ${BIN:-<none>}"
          if [ -n "$BIN" ]; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
            echo "bin=$BIN"  >> "$GITHUB_OUTPUT"
            ls -lh "$BIN"
          else
            echo "built=no" >> "$GITHUB_OUTPUT"
            echo "::error::No firefox binary anywhere under /mnt or $SRC."
            echo "--- objdir candidates ---"
            find /mnt "$SRC" -maxdepth 3 -type d -name "obj*" 2>/dev/null | head
            echo "--- dist/bin contents ---"
            find /mnt "$SRC" -maxdepth 5 -type d -path "*dist/bin" 2>/dev/null | head |
              while read -r d; do echo "== $d"; ls -la "$d" | head -20; done
          fi

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /mnt/build.log
          if-no-files-found: warn

      - name: Run the PoC — CONTROL then ATTACK
        if: steps.check.outputs.built == 'yes'
        run: |
          set -x
          cd "$SRC"
          ./mach run --headless --setpref browser.tabs.remote.autostart=true \
            "$GITHUB_WORKSPACE/poc/poc.html" 2>&1 | tee control.log || true

          MOZ_POC_BLOB_SPOOF=1 ./mach run --headless \
            --setpref browser.tabs.remote.autostart=true \
            "$GITHUB_WORKSPACE/poc/poc.html" 2>&1 | tee attack.log || true

          echo "===== CONTROL ====="; grep -iE 'POC-OUTCOME|\[POC\]|spoofing' control.log || true
          echo "===== ATTACK  ====="; grep -iE 'POC-OUTCOME|\[POC\]|spoofing' attack.log  || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-logs
          path: |
            /mnt/ffx/control.log
            /mnt/ffx/attack.log
          if-no-files-found: ignore

      - name: Fail the run if the build never finished
        if: steps.check.outputs.built != 'yes'
        run: |
          echo "Build did not produce a binary this run — see the [mon ...] lines"
          echo "in the Build step for whether memory or disk was the constraint."
          exit 1
